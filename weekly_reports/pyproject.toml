[project]
name = "agent-reliability-reports"
version = "0.1.0"
description = "Turn Phoenix traces and a send log into a weekly agent-reliability report."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
phoenix = ["arize-phoenix-client>=1.0"]

[project.scripts]
reliab = "reliab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
